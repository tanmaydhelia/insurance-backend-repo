version: '3.8'

services:
  # =====================================================
  # 1. DATABASE SERVICE - MySQL
  # =====================================================
  insurance-db:
    image: mysql:8.0
    container_name: insurance-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 16434
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - insurance-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================
  # 9. Conig Server
  # =====================================================
  config-server:
    build: ./insurance-config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_APPLICATION_JSON={"eureka":{"client":{"service-url":{"defaultZone":"http://service-registry:8761/eureka/"}}}}
    depends_on:
      - service-registry
      - kafka
    networks:
      - insurance-network
    entrypoint: ["sh", "-c", "sleep 50 && java -jar app.jar"]

  # =====================================================
  # 2. MESSAGE QUEUE - Apache Kafka (KRaft mode)
  # =====================================================
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - insurance-network

  # =====================================================
  # 3. EUREKA SERVER - Service Registry
  # =====================================================
  service-registry:
    build: ./insurance-service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_INSTANCE_HOSTNAME=service-registry
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    networks:
      - insurance-network
    entrypoint: ["sh", "-c", "sleep 20 && java -jar app.jar"]

  # =====================================================
  # 4. IDENTITY SERVICE - Auth & User Management
  # =====================================================
  identity-service:
    build: ./insurance-identity-service
    container_name: identity-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://insurance-db:3306/insurance_identity_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=16434
      - SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_APPLICATION_JSON={"eureka":{"client":{"service-url":{"defaultZone":"http://service-registry:8761/eureka/"}}}}
    depends_on:
      - insurance-db
      - service-registry
      - kafka
    networks:
      - insurance-network
    entrypoint: ["sh", "-c", "sleep 40 && java -jar app.jar"]

  # =====================================================
  # 5. POLICY SERVICE - Insurance Policy Management
  # =====================================================
  policy-service:
    build: ./insurance-policy-service
    container_name: policy-service
    ports:
      - "8095:8095"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://insurance-db:3306/insurance_policy_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=16434
      - SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_APPLICATION_JSON={"eureka":{"client":{"service-url":{"defaultZone":"http://service-registry:8761/eureka/"}}}}
    depends_on:
      - insurance-db
      - service-registry
      - kafka
    networks:
      - insurance-network
    entrypoint: ["sh", "-c", "sleep 40 && java -jar app.jar"]

  # =====================================================
  # 6. CLAIMS SERVICE - Insurance Claims Processing
  # =====================================================
  claims-service:
    build: ./insurance-claims-service
    container_name: claims-service
    ports:
      - "8100:8100"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://insurance-db:3306/insurance_claim_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=16434
      - SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_APPLICATION_JSON={"eureka":{"client":{"service-url":{"defaultZone":"http://service-registry:8761/eureka/"}}}}
    depends_on:
      - insurance-db
      - service-registry
      - kafka
      - policy-service
    networks:
      - insurance-network
    entrypoint: ["sh", "-c", "sleep 50 && java -jar app.jar"]

  # =====================================================
  # 7. HOSPITAL SERVICE - Healthcare Provider Management
  # =====================================================
  hospital-service:
    build: ./insurance-hospital-service
    container_name: hospital-service
    ports:
      - "8105:8105"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://insurance-db:3306/insurance_provider_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=16434
      - SPRING_APPLICATION_JSON={"eureka":{"client":{"service-url":{"defaultZone":"http://service-registry:8761/eureka/"}}}}
    depends_on:
      - insurance-db
      - service-registry
    networks:
      - insurance-network
    entrypoint: ["sh", "-c", "sleep 40 && java -jar app.jar"]

  # =====================================================
  # 8. BILLING SERVICE - Payment & Billing
  # =====================================================
  billing-service:
    build: ./insurance-billing-service
    container_name: billing-service
    ports:
      - "8115:8115"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://insurance-db:3306/insurance_billing_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=16434
      - SPRING_APPLICATION_JSON={"eureka":{"client":{"service-url":{"defaultZone":"http://service-registry:8761/eureka/"}}}}
    depends_on:
      - insurance-db
      - service-registry
    networks:
      - insurance-network
    entrypoint: ["sh", "-c", "sleep 40 && java -jar app.jar"]

  # =====================================================
  # 9. NOTIFICATION SERVICE - Email & Alerts
  # =====================================================
  notification-service:
    build: ./insurance-notification-service
    container_name: notification-service
    ports:
      - "8110:8110"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_APPLICATION_JSON={"eureka":{"client":{"service-url":{"defaultZone":"http://service-registry:8761/eureka/"}}}}
    depends_on:
      - service-registry
      - kafka
    networks:
      - insurance-network
    entrypoint: ["sh", "-c", "sleep 50 && java -jar app.jar"]

  # =====================================================
  # 10. API GATEWAY - Single Entry Point
  # =====================================================
  api-gateway:
    build: ./insurance-api-gateway
    container_name: api-gateway
    ports:
      - "9000:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_APPLICATION_JSON={"eureka":{"client":{"service-url":{"defaultZone":"http://service-registry:8761/eureka/"}}}}
    depends_on:
      - service-registry
      - identity-service
      - policy-service
      - claims-service
      - hospital-service
      - billing-service
      - notification-service
    networks:
      - insurance-network
    entrypoint: ["sh", "-c", "sleep 60 && java -jar app.jar"]

# =====================================================
# VOLUMES
# =====================================================
volumes:
  mysql_data:

# =====================================================
# NETWORKS
# =====================================================
networks:
  insurance-network:
    driver: bridge
