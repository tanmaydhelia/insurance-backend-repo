server:
  port: 8115

spring:
  application:
    name: INSURANCE-BILLING-SERVICE
  datasource:
    url: jdbc:mysql://localhost:3306/insurance_billing_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_demo}
  key-secret: ${RAZORPAY_KEY_SECRET:secret}
